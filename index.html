<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="Habits, weight, Quran and journal in one fast tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tracker.ME</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // Apply theme + accent before first paint (no flash).
  try {
    var s = JSON.parse(localStorage.getItem('trackerme:v1') || '{}').settings || {};
    var t = s.theme || 'dark';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    if (s.accent) document.documentElement.style.setProperty('--acc', s.accent);
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="#today"><span class="logo" aria-hidden="true"></span><span>Tracker<b>.ME</b></span></a>
    <a class="tab" href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg><span>Today</span></a>
    <a class="tab" href="#habits" data-tab="habits"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Habits</span></a>
    <a class="tab" href="#weight" data-tab="weight"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 10.5a5.5 5.5 0 018 0"/><path d="M12 12.5l1.6-2.6"/></svg><span>Weight</span></a>
    <a class="tab" href="#quran" data-tab="quran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 5h6a3.5 3.5 0 013.5 3.5V20a2.5 2.5 0 00-2.5-2.5h-7z"/><path d="M21.5 5h-6A3.5 3.5 0 0012 8.5V20a2.5 2.5 0 012.5-2.5h7z"/></svg><span>Quran</span></a>
    <a class="tab" href="#journal" data-tab="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8.5"/><path d="M16.5 3.8a2.1 2.1 0 013 3L7.5 18.8l-4 1 1-4z"/></svg><span>Journal</span></a>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="sheet" aria-label="Dialog"><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
